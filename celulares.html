<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celulares | TechStore</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-category="celulares">
    <header>
      <div class="header-container">
        <a href="index.html" class="logo">Tech<span>Store</span></a>
        <nav>
          <ul class="nav-links" id="nav-links">
            <li><a href="index.html">Todos</a></li>
            <li><a href="celulares.html" class="active">Celulares</a></li>
            <li><a href="computadoras.html">Computadoras</a></li>
            <li><a href="tablets.html">Tablets</a></li>
          </ul>
        </nav>
        <div class="header-icons">
          <div class="menu-toggle" id="menu-toggle">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </div>
          <div class="cart-icon" id="cart-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path
                d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
              ></path>
            </svg>
            <span class="cart-count">0</span>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="hero" style="padding: 4rem 2rem">
        <div class="hero-content">
          <h1 style="font-size: 3rem">Celulares Inteligentes</h1>
          <p>
            Los mejores smartphones del mercado con tecnología de punta y
            diseños extraordinarios.
          </p>
        </div>
      </section>

      <section id="productos" class="products-section">
        <h2 class="section-title">Catálogo de Celulares</h2>
        <div class="products-grid" id="products-grid">
          <!-- JS Injected -->
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 TechStore. Todos los derechos reservados.</p>
    </footer>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cart-sidebar">
      <div class="cart-header">
        <h2>Tu Carrito</h2>
        <button class="close-cart" id="close-cart">&times;</button>
      </div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-footer">
        <div class="cart-total">
          <span>Total:</span>
          <span id="total-price">$0.00</span>
        </div>
        <button class="checkout-button">Proceder al Pago</button>
      </div>
    </div>
    <div class="cart-overlay" id="cart-overlay"></div>

    <script src="script.js"></script>
  </body>
</html>
